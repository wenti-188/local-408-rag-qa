<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408本地离线问答助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft Yahei", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1a73e8; color: white; padding: 16px 24px; text-align: center; font-size: 18px; font-weight: 500; }
        .chat-container { flex: 1; overflow-y: auto; padding: 24px; max-width: 900px; margin: 0 auto; width: 100%; }
        .message { margin-bottom: 20px; display: flex; }
        .user-message { justify-content: flex-end; }
        .message-bubble { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; }
        .user-message .message-bubble { background: #1a73e8; color: white; border-bottom-right-radius: 4px; }
        .ai-message .message-bubble { background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-area { padding: 16px; background: white; border-top: 1px solid #e5e7eb; }
        .input-wrapper { max-width: 900px; margin: 0 auto; display: flex; gap: 12px; }
        #question-input { flex: 1; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; }
        #question-input:focus { border-color: #1a73e8; }
        #send-btn { padding: 12px 24px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
        #send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="header">408本地离线问答助手（纯本地运行，不联网）</div>
    <div class="chat-container" id="chat-container">
        <div class="message ai-message">
            <div class="message-bubble">你好！我是你的408复习助手，你可以问我数据结构、计算机组成原理、操作系统、计算机网络的相关考点，所有回答都来自你本地的知识库，完全离线运行。</div>
        </div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="question-input" placeholder="输入你的408问题，按回车发送..." autofocus>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(text, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendQuestion() {
            const q = input.value.trim();
            if (!q) return;
            addMessage(q, true);
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '思考中...';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q})
                });
                const data = await res.json();
                addMessage(data.answer, false);
            } catch (e) {
                addMessage('请求出错，请检查服务是否正常', false);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        sendBtn.addEventListener('click', sendQuestion);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendQuestion();
        });
    </script>
</body>
</html>
