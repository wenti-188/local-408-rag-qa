<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408本地离线问答助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: white;
            border-bottom: 1px solid #eee;
            padding: 16px 24px;
            text-align: center;
        }
        .header h1 { font-size: 17px; font-weight: 600; color: #111; }
        .header p { font-size: 12px; color: #999; margin-top: 4px; }
        .func-bar {
            max-width: 800px;
            margin: 12px auto 0;
            display: flex;
            gap: 12px;
        }
        .func-btn {
            padding: 8px 16px;
            border: 1px solid #111;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .func-btn:hover { background: #111; color: white; }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message { margin-bottom: 20px; display: flex; }
        .user-message { justify-content: flex-end; }
        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
        }
        .user-message .message-bubble { background: #111; color: white; border-bottom-right-radius: 4px; }
        .ai-message .message-bubble { background: white; color: #222; border: 1px solid #eee; border-bottom-left-radius: 4px; }
        .quiz-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .quiz-card h3 { font-size: 16px; margin-bottom: 16px; line-height: 1.5; }
        .quiz-option {
            display: block;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .quiz-option:hover { border-color: #111; background: #f5f5f5; }
        .quiz-option.selected { border-color: #111; background: #111; color: white; }
        .quiz-result { margin-top: 16px; font-size: 14px; }
        .correct { color: #22c55e; }
        .wrong { color: #ef4444; }
        .input-area { padding: 16px 20px; background: white; border-top: 1px solid #eee; }
        .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
        #question-input { flex: 1; padding: 13px 18px; border: 1px solid #ddd; border-radius: 24px; font-size: 15px; outline: none; }
        #question-input:focus { border-color: #111; }
        #send-btn { padding: 12px 28px; background: #111; color: white; border: none; border-radius: 24px; cursor: pointer; font-size: 15px; }
        #send-btn:disabled { background: #888; cursor: not-allowed; }
        .elapsed-time { margin-top: 8px; font-size: 12px; color: #999; text-align: right; }
    </style>
</head>
<body>
    <div class="header">
        <h1>408本地离线复习助手</h1>
        <p>纯本地运行 · 问答刷题一体</p>
        <div class="func-bar">
            <button class="func-btn" onclick="startQuiz()">开始刷题</button>
        </div>
    </div>
    <div class="chat-container" id="chat-container"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="question-input" placeholder="输入408相关问题，回车发送..." autofocus>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        let timer = null;
        let currentQuiz = null;

        function cleanMarkdown(text) {
            return text.replace(/\*\*/g, '').replace(/\*/g, '').replace(/#{1,6}/g, '').replace(/`/g, '');
        }

        function addMessage(text, isUser, elapsedTime) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            let html = isUser ? text : cleanMarkdown(text);
            if (!isUser && elapsedTime !== undefined) {
                html += `\n<div class="elapsed-time">思考耗时 ${elapsedTime} 秒</div>`;
            }
            messageDiv.innerHTML = `<div class="message-bubble">${html}</div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function loadHistory() {
            addMessage("你好！我是你的408复习助手，可以问知识点，也可以点上面的按钮开始刷题，错题会自动存到错题本里。", false);
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                const records = data.records.reverse();
                records.forEach(record => {
                    addMessage(record.question, true);
                    addMessage(record.answer, false);
                });
            } catch (e) {}
        }

        async function sendQuestion() {
            const q = input.value.trim();
            if (!q) return;
            addMessage(q, true);
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '思考中...';
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai-message';
            loadingDiv.innerHTML = `<div class="message-bubble">正在检索知识库，请稍等...</div>`;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q})
                });
                const data = await res.json();
                loadingDiv.querySelector('.message-bubble').innerHTML = 
                    `${cleanMarkdown(data.answer)}<div class="elapsed-time">思考耗时 ${data.elapsed_time} 秒</div>`;
            } catch (e) {
                loadingDiv.querySelector('.message-bubble').textContent = '请求出错';
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        async function startQuiz() {
            sendBtn.disabled = true;
            const loadingTip = document.createElement('div');
            loadingTip.className = 'message ai-message';
            loadingTip.innerHTML = `<div class="message-bubble">正在调用大模型生成题目，请等待15-20秒...</div>`;
            chatContainer.appendChild(loadingTip);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            try {
                const res = await fetch('/api/generate-quiz');
                loadingTip.remove();
                currentQuiz = await res.json();
                if (currentQuiz.error) { alert("题目生成失败，请重试"); return; }
                const quizDiv = document.createElement('div');
                quizDiv.className = 'quiz-card';
                quizDiv.id = 'current-quiz';
                let optionsHtml = '';
                for (let opt of ['A','B','C','D']) {
                    optionsHtml += `<div class="quiz-option" data-opt="${opt}" onclick="selectOption(this)">${opt}. ${currentQuiz.options[opt]}</div>`;
                }
                quizDiv.innerHTML = `
                    <h3>${currentQuiz.question}</h3>
                    ${optionsHtml}
                    <div id="quiz-result"></div>
                    <button id="submit-quiz-btn" class="func-btn" style="margin-top:12px" onclick="submitQuiz()">提交答案</button>
                `;
                chatContainer.appendChild(quizDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (e) {
                alert("题目生成失败，请重试");
            } finally {
                sendBtn.disabled = false;
            }
        }

        let selectedOpt = null;
        function selectOption(el) {
            document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            selectedOpt = el.dataset.opt;
        }

        async function submitQuiz() {
            if (!selectedOpt) { alert("请先选一个选项"); return; }
            document.getElementById('submit-quiz-btn').disabled = true;
            const res = await fetch('/api/submit-quiz', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    question: currentQuiz.question,
                    options: currentQuiz.options,
                    correct_answer: currentQuiz.correct_answer,
                    user_answer: selectedOpt,
                    explanation: currentQuiz.explanation
                })
            });
            const result = await res.json();
            const resultDiv = document.getElementById('quiz-result');
            if (result.is_correct) {
                resultDiv.innerHTML = `<div class="correct">✅ 回答正确！</div><div style="margin-top:8px; font-size:14px; color:#555">📖 解析：${currentQuiz.explanation}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="wrong">❌ 回答错误，正确答案是 ${result.correct_answer}</div><div style="margin-top:8px; font-size:14px; color:#555">📖 解析：${currentQuiz.explanation}</div>`;
            }
            selectedOpt = null;
        }

        sendBtn.addEventListener('click', sendQuestion);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuestion(); });
        loadHistory();
    </script>
</body>
</html>
