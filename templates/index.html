<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408本地问答助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: white;
            border-bottom: 1px solid #eee;
            padding: 16px 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 17px;
            font-weight: 600;
            color: #111;
        }
        .header p {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .message {
            margin-bottom: 24px;
            display: flex;
        }
        .user-message { justify-content: flex-end; }
        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.7;
            font-size: 15px;
            white-space: pre-wrap;
        }
        .user-message .message-bubble {
            background: #111;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-message .message-bubble {
            background: white;
            color: #222;
            border: 1px solid #eee;
            border-bottom-left-radius: 4px;
        }
        .loading-bubble {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
        }
        .loading-spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #eee;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .live-timer {
            color: #111;
            font-weight: 600;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .elapsed-time {
            margin-top: 8px;
            font-size: 12px;
            color: #999;
            text-align: right;
        }
        .input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #eee;
        }
        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #question-input {
            flex: 1;
            padding: 13px 18px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }
        #question-input:focus { border-color: #111; }
        #send-btn {
            padding: 12px 28px;
            background: #111;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 15px;
        }
        #send-btn:hover { background: #333; }
        #send-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>408本地离线问答助手</h1>
        <p>纯本地运行 · 无需联网 · 170个核心考点内置</p>
    </div>
    <div class="chat-container" id="chat-container"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="question-input" placeholder="输入408相关问题，回车发送..." autofocus>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        let timer = null;

        // 过滤掉回答里多余的Markdown符号（星号、井号等），保留正常分段
        function cleanMarkdown(text) {
            return text.replace(/\*\*/g, '').replace(/\*/g, '').replace(/#{1,6}/g, '').replace(/`/g, '');
        }

        function addMessage(text, isUser, elapsedTime) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            let html = isUser ? text : cleanMarkdown(text);
            if (!isUser && elapsedTime !== undefined) {
                html += `\n<div class="elapsed-time">思考耗时 ${elapsedTime} 秒</div>`;
            }
            messageDiv.innerHTML = `<div class="message-bubble">${html}</div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai-message';
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="loading-bubble">
                        <div class="loading-spinner"></div>
                        <span>正在检索知识库，已用时 <span class="live-timer">0</span> 秒...</span>
                    </div>
                </div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        async function loadHistory() {
            addMessage("你好！我是你的408复习助手，数据结构、组成原理、操作系统、计算机网络的核心考点都可以问我。", false);
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                const records = data.records.reverse();
                records.forEach(record => {
                    addMessage(record.question, true);
                    addMessage(record.answer, false);
                });
            } catch (e) {}
        }

        async function sendQuestion() {
            const q = input.value.trim();
            if (!q) return;
            addMessage(q, true);
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '思考中...';
            const loadingDiv = addLoadingMessage();
            const liveTimer = loadingDiv.querySelector('.live-timer');
            let elapsed = 0;
            timer = setInterval(() => {
                elapsed += 1;
                liveTimer.textContent = elapsed;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q})
                });
                const data = await res.json();
                clearInterval(timer);
                const cleanAnswer = cleanMarkdown(data.answer);
                loadingDiv.querySelector('.message-bubble').innerHTML = 
                    `${cleanAnswer}<div class="elapsed-time">思考耗时 ${data.elapsed_time} 秒</div>`;
            } catch (e) {
                clearInterval(timer);
                loadingDiv.querySelector('.message-bubble').textContent = '请求出错，请检查服务是否正常';
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        sendBtn.addEventListener('click', sendQuestion);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendQuestion();
        });
        loadHistory();
    </script>
</body>
</html>
