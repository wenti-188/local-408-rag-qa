<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>408本地离线复习助手</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: "微软雅黑", sans-serif; }
        body { background:#fafafa; color:#111; height:100vh; display:flex; flex-direction:column; }
        .header { padding:20px; text-align:center; border-bottom:1px solid #eee; background:white; }
        .header h1 { font-size:20px; font-weight:600; margin-bottom:6px; }
        .header p { font-size:12px; color:#999; }
        .func-bar { margin-top:12px; }
        .func-btn { padding:8px 20px; border:1px solid #111; background:white; cursor:pointer; border-radius:4px; font-size:14px; }
        .func-btn:hover { background:#111; color:white; }
        .chat-container { flex:1; max-width:800px; width:90%; margin:20px auto; overflow-y:auto; padding:20px 0; }
        .message { margin-bottom:16px; display:flex; }
        .user-message { justify-content:flex-end; }
        .message-bubble { max-width:75%; padding:12px 16px; border-radius:8px; line-height:1.6; font-size:15px; white-space:pre-wrap; }
        .user-message .message-bubble { background:#111; color:white; }
        .ai-message .message-bubble { background:white; border:1px solid #eee; }
        .input-area { padding:20px; border-top:1px solid #eee; background:white; }
        .input-wrapper { max-width:800px; margin:0 auto; display:flex; gap:12px; }
        #question-input { flex:1; padding:12px 16px; border:1px solid #ddd; border-radius:6px; font-size:15px; }
        #send-btn { padding:12px 24px; background:#111; color:white; border:none; border-radius:6px; cursor:pointer; }
        #send-btn:disabled { background:#888; cursor:not-allowed; }
        .elapsed-time { margin-top:8px; font-size:12px; color:#999; text-align:right; }
        .loading-dots { display:inline-flex; gap:4px; padding:4px 0; }
        .loading-dots span { width:6px; height:6px; border-radius:50%; background:#999; animation: bounce 1.2s infinite ease-in-out; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity:0.4; }
            40% { transform: translateY(-6px); opacity:1; }
        }
        .quiz-card { background:white; border:1px solid #111; border-radius:8px; padding:24px; margin:16px 0; }
        .quiz-option { padding:10px; border:1px solid #ccc; border-radius:6px; margin:8px 0; cursor:pointer; }
        .quiz-option.selected { background:#111; color:white; border-color:#111; }
        .quiz-result { margin-top:16px; padding:12px; background:#f5f5f5; border-radius:6px; font-size:14px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>408本地离线复习助手</h1>
        <p>纯本地运行 · 问答刷题一体</p>
        <div class="func-bar">
            <button class="func-btn" onclick="startQuiz()">开始刷题</button>
        </div>
    </div>
    <div class="chat-container" id="chat-container"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="question-input" placeholder="输入408相关问题，回车发送..." autofocus>
            <button id="send-btn">发送</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const input = document.getElementById('question-input');
        const sendBtn = document.getElementById('send-btn');
        let currentQuiz = null;
        let selectedOpt = null;

        function cleanMarkdown(text) {
            return text.replace(/\*\*/g, '').replace(/\*/g, '').replace(/#{1,6}/g, '').replace(/`/g, '');
        }

        function addMessage(text, isUser, elapsedTime) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            let html = isUser ? text : cleanMarkdown(text);
            if (!isUser && elapsedTime !== undefined) {
                html += `\n<div class="elapsed-time">思考耗时 ${elapsedTime} 秒</div>`;
            }
            messageDiv.innerHTML = `<div class="message-bubble">${html}</div>`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function loadHistory() {
            addMessage("你好！我是你的408复习助手，可以问知识点，也可以点上面的按钮开始刷题。", false);
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                const records = data.records.reverse();
                records.forEach(record => {
                    addMessage(record.question, true);
                    addMessage(record.answer, false);
                });
            } catch (e) {}
        }

        async function sendQuestion() {
            const q = input.value.trim();
            if (!q) return;
            addMessage(q, true);
            input.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '生成中...';
            const bubble = document.createElement('div');
            bubble.className = 'message ai-message';
            bubble.innerHTML = `<div class="message-bubble"></div>`;
            chatContainer.appendChild(bubble);
            const bubbleText = bubble.querySelector('.message-bubble');
            bubbleText.innerHTML = '正在检索知识库、生成回答中 <div class="loading-dots"><span></span><span></span><span></span></div>';

            const start = Date.now();
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q})
                });
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    fullText += decoder.decode(value, {stream:true});
                    bubbleText.innerHTML = cleanMarkdown(fullText);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
                const elapsed = ((Date.now() - start)/1000).toFixed(1);
                bubbleText.innerHTML = `${cleanMarkdown(fullText)}<div class="elapsed-time">思考耗时 ${elapsed} 秒</div>`;
            } catch (e) {
                bubbleText.textContent = '请求出错';
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        async function startQuiz() {
            sendBtn.disabled = true;
            const loadingTip = document.createElement('div');
            loadingTip.className = 'message ai-message';
            loadingTip.innerHTML = `<div class="message-bubble">正在调用本地大模型生成题目 <div class="loading-dots"><span></span><span></span><span></span></div></div>`;
            chatContainer.appendChild(loadingTip);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            try {
                const res = await fetch('/api/generate-quiz');
                loadingTip.remove();
                currentQuiz = await res.json();
                if (currentQuiz.error) { alert("题目生成失败，请重试"); return; }
                const quizDiv = document.createElement('div');
                quizDiv.className = 'quiz-card';
                let optionsHtml = '';
                for (let opt of ['A','B','C','D']) {
                    optionsHtml += `<div class="quiz-option" data-opt="${opt}" onclick="selectOption(this)">${opt}. ${currentQuiz.options[opt]}</div>`;
                }
                quizDiv.innerHTML = `
                    <h3 style="margin-bottom:16px; line-height:1.5;">${currentQuiz.question}</h3>
                    ${optionsHtml}
                    <div id="quiz-result" class="quiz-result" style="display:none;"></div>
                    <button class="func-btn" id="submit-quiz-btn" style="margin-top:16px;" onclick="submitQuiz()">提交答案</button>
                `;
                chatContainer.appendChild(quizDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch (e) {
                alert("题目生成失败，请重试");
            } finally {
                sendBtn.disabled = false;
            }
        }

        function selectOption(el) {
            document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            selectedOpt = el.dataset.opt;
        }

        async function submitQuiz() {
            if (!selectedOpt) { alert("请先选一个选项"); return; }
            document.getElementById('submit-quiz-btn').disabled = true;
            const resultDiv = document.getElementById('quiz-result');
            resultDiv.style.display = 'block';
            const isCorrect = (selectedOpt === currentQuiz.correct_answer);
            if (isCorrect) {
                resultDiv.innerHTML = `<div>✅ 回答正确！</div><div style="margin-top:8px; color:#555">解析：${currentQuiz.explanation}</div>`;
            } else {
                resultDiv.innerHTML = `<div>❌ 回答错误，正确答案是 ${currentQuiz.correct_answer}</div><div style="margin-top:8px; color:#555">解析：${currentQuiz.explanation}</div>`;
            }
            selectedOpt = null;
        }

        sendBtn.addEventListener('click', sendQuestion);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuestion(); });
        loadHistory();
    </script>
</body>
</html>
